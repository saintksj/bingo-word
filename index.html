<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말빙고 - 진행 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .stage{
    background:var(--surface); border:1px solid var(--border); border-radius:22px;
    padding:26px 22px; box-shadow:var(--shadow); min-height:38vh;
    display:flex; flex-direction:column; justify-content:center;
  }
  #wordCloud{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-content:center; }
  #wordCloudPlay{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-content:center; }
  .cloudWord{
    font-family:'Jua',sans-serif; font-weight:400; font-size:clamp(20px,3.4vw,32px);
    background:var(--warm-tint); color:var(--warm-strong); border-radius:20px; padding:10px 22px; line-height:1.2;
    cursor:default;
  }
  .cloudWord.callable{ cursor:pointer; }
  .cloudWord.calledOut{ background:var(--surface-2); color:var(--ink-soft); text-decoration:line-through; }
  .empty-note{ color:var(--ink-soft); font-size:18px; font-weight:500; text-align:center; }
  #currentCallLabel{ text-align:center; color:var(--ink-soft); letter-spacing:.1em; text-transform:uppercase; font-size:14.5px; font-weight:700; }
  #currentCall{ font-family:'Jua',sans-serif; font-weight:400; text-align:center; font-size:clamp(36px,9vw,56px); color:var(--warm-strong); margin:6px 0 0; min-height:1.2em; }
  .control-bar{ background:var(--surface-2); border:2px dashed var(--border); border-radius:16px; padding:14px 16px; margin-top:16px; display:flex; flex-direction:column; gap:10px; }
  .stat-line{ font-size:15px; font-weight:500; color:var(--ink-soft); text-align:center; margin-top:8px; }
  .stat-line b{ color:var(--ink); font-variant-numeric:tabular-nums; }
  #roster{ display:flex; flex-wrap:wrap; gap:8px; }
  .rosterChip{ background:var(--cool-tint); color:var(--ink); border-radius:999px; padding:6px 13px; font-size:14px; }
  .rosterChip.bingo{ background:var(--gold-tint); border:1.5px solid var(--gold); font-weight:700; }
  #winnerFeed{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .winnerLine{ background:var(--gold-tint); border:1px solid var(--gold); border-radius:12px; padding:8px 12px; font-size:14px; }
  .note-box{ background:var(--cool-tint); border-radius:14px; padding:14px 16px; font-size:14.5px; font-weight:500; color:var(--ink); margin-top:14px; }
  .note-box p{ margin:0; }
  #pinGateWrap{ max-width:360px; margin:70px auto; padding:0 16px; }
  #pinGateWrap .card{ text-align:center; }
  #pinGateWrap input{ width:100%; margin-bottom:12px; text-align:center; letter-spacing:.2em; font-size:20px; }
  #pinGateWrap button{ width:100%; padding:12px; font-size:16px; }
  #pinError{ color:var(--danger); font-size:14px; font-weight:700; margin-top:10px; }
</style>
</head>
<body>
  <div id="pinGateWrap">
    <div class="card">
      <h2>🔒 선생님 확인</h2>
      <p class="hint">진행 화면에 들어가려면 비밀번호를 입력해주세요.</p>
      <input type="password" id="pinInput" inputmode="numeric" placeholder="비밀번호" maxlength="10">
      <button class="btn-cool" id="pinSubmitBtn" type="button">입장하기</button>
      <p id="pinError" hidden>비밀번호가 올바르지 않아요.</p>
    </div>
  </div>
  <div class="wrap" id="mainWrap" hidden>
    <p class="eyebrow">진행 화면 · 프로젝터용</p>
    <p class="topicDisplay" id="topicDisplay">오늘의 주제를 아래에 입력해보세요</p>

    <div class="stage">
      <div id="collectingBox">
        <div id="wordCloud"></div>
      </div>
      <div id="playingBox" hidden>
        <div id="currentCallLabel">방금 부른 낱말 (낱말을 눌러 다음을 불러보세요)</div>
        <p id="currentCall">-</p>
        <div id="wordCloudPlay" style="margin-top:14px;"></div>
      </div>
    </div>
    <p class="stat-line">🙋 참가 <b id="participantCount">0</b>명 · 🗨️ 낱말 <b id="poolCount">0</b>개 · 🎯 <b id="sizeLabel">3×3</b> · 🏁 <b id="winLinesLabel">1줄</b> 빙고</p>

    <div id="winnerFeed"></div>

    <div class="control-bar">
      <div class="control-row">
        <input type="text" id="topicInput" placeholder="오늘의 주제 (예: 좋은 말 모으기)">
        <button class="btn-ghost" id="setTopicBtn" type="button">주제 저장</button>
      </div>
      <div class="control-row" id="wordAddRow">
        <input type="text" id="wordInput" placeholder="낱말 입력 (예: 고마워)" maxlength="10">
        <button class="btn-ghost" id="addWordBtn" type="button">추가</button>
      </div>
      <div class="control-row" id="sizeRow">
        <label>빙고판 크기</label>
        <div class="chips">
          <button type="button" class="sizeBtn active" data-v="3">3×3</button>
          <button type="button" class="sizeBtn" data-v="4">4×4</button>
          <button type="button" class="sizeBtn" data-v="5">5×5</button>
        </div>
      </div>
      <div class="control-row" id="winLinesRow">
        <label>몇 줄이면 빙고?</label>
        <div class="chips">
          <button type="button" class="winBtn active" data-v="1">1줄</button>
          <button type="button" class="winBtn" data-v="2">2줄</button>
          <button type="button" class="winBtn" data-v="3">3줄</button>
        </div>
      </div>
      <div class="control-row">
        <button class="btn-warm" id="toBuildingBtn" type="button">➡ 빙고판 만들기 시작</button>
        <button class="btn-warm" id="toPlayingBtn" type="button" hidden>▶ 빙고 게임 시작</button>
        <button class="btn-ghost" id="playAgainBtn" type="button" hidden>🔁 같은 낱말로 다시하기</button>
        <button class="btn-danger" id="resetBtn" type="button">🔄 전체 초기화</button>
      </div>
    </div>

    <div class="note-box">
      <p>💡 학생들에게는 아래 링크를 전달해주세요. 낱말을 부르려면 위쪽 낱말을 <b>눌러주세요</b> — 자동으로 학생들 빙고판에 빨간 동그라미가 표시됩니다.</p>
      <div class="link-row">
        <input type="text" id="studentUrlHint" readonly>
        <button class="btn-cool" id="copyLinkBtn" type="button">📋 링크 복사</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
  (function(){
    // 선생님 화면 비밀번호 — 원하시는 숫자로 바꾸고 싶으면 이 값만 수정하시면 돼요.
    const TEACHER_PIN = '4312';

    function unlockTeacher(){
      document.getElementById('pinGateWrap').hidden = true;
      document.getElementById('mainWrap').hidden = false;
    }
    try {
      if (sessionStorage.getItem('wb_teacher_unlocked') === 'yes') unlockTeacher();
    } catch(e){}

    document.getElementById('pinSubmitBtn').addEventListener('click', function(){
      const val = document.getElementById('pinInput').value.trim();
      if (val === TEACHER_PIN){
        try { sessionStorage.setItem('wb_teacher_unlocked', 'yes'); } catch(e){}
        unlockTeacher();
      } else {
        document.getElementById('pinError').hidden = false;
        const input = document.getElementById('pinInput');
        input.value = '';
        input.focus();
      }
    });
    document.getElementById('pinInput').addEventListener('keydown', function(e){
      if (e.key === 'Enter') document.getElementById('pinSubmitBtn').click();
    });

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const gameRef = db.ref('game');

    const studentUrl = location.origin + location.pathname.replace(/index\.html$/,'') + 'student.html';
    const studentUrlInput = document.getElementById('studentUrlHint');
    studentUrlInput.value = studentUrl;
    studentUrlInput.addEventListener('click', function(){ this.select(); });
    studentUrlInput.addEventListener('focus', function(){ this.select(); });

    function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    let state = { topic:'', size:3, winLines:1, phase:'collecting', words:{}, students:{} };
    const announced = new Set();

    function checkLines(cells, size, calledTexts){
      const ok = i => { const w = cells[i]; return !!w && calledTexts.has(w); };
      let lines = 0;
      for (let r=0;r<size;r++){
        let row=true, col=true;
        for (let c=0;c<size;c++){ if(!ok(r*size+c)) row=false; if(!ok(c*size+r)) col=false; }
        if(row) lines++; if(col) lines++;
      }
      let d1=true, d2=true;
      for (let i=0;i<size;i++){ if(!ok(i*size+i)) d1=false; if(!ok(i*size+(size-1-i))) d2=false; }
      if(d1) lines++; if(d2) lines++;
      return lines;
    }

    function render(){
      const words = state.words || {};
      const wordList = Object.keys(words).map(k => ({ id:k, ...words[k] }));
      const calledTexts = new Set(wordList.filter(w=>w.called).map(w=>w.text));

      document.getElementById('topicDisplay').textContent = state.topic || '오늘의 주제를 아래에 입력해보세요';
      document.getElementById('poolCount').textContent = wordList.length;
      document.getElementById('sizeLabel').textContent = state.size + '×' + state.size;
      document.getElementById('winLinesLabel').textContent = state.winLines + '줄';
      document.querySelectorAll('.sizeBtn').forEach(b=> b.classList.toggle('active', parseInt(b.dataset.v,10)===state.size));
      document.querySelectorAll('.winBtn').forEach(b=> b.classList.toggle('active', parseInt(b.dataset.v,10)===state.winLines));

      const students = state.students || {};
      const names = Object.keys(students);
      document.getElementById('participantCount').textContent = names.length;
      document.getElementById('roster') && (document.getElementById('roster').innerHTML = '');

      const collecting = state.phase === 'collecting';
      const building = state.phase === 'building';
      const playing = state.phase === 'playing';

      document.getElementById('collectingBox').hidden = playing;
      document.getElementById('playingBox').hidden = !playing;
      document.getElementById('wordAddRow').hidden = playing;
      document.getElementById('sizeRow').hidden = !collecting;
      document.getElementById('winLinesRow').hidden = playing;
      document.getElementById('toBuildingBtn').hidden = !collecting;
      document.getElementById('toPlayingBtn').hidden = !building;
      document.getElementById('playAgainBtn').hidden = collecting;

      const cloudHtml = wordList.length
        ? wordList.map(w => '<span class="cloudWord">' + esc(w.text) + '</span>').join('')
        : '<p class="empty-note">아직 모은 낱말이 없어요. 아래에서 입력해보세요!</p>';
      document.getElementById('wordCloud').innerHTML = cloudHtml;

      if (playing){
        const lastCalled = wordList.filter(w=>w.called).sort((a,b)=>(b.calledAt||0)-(a.calledAt||0))[0];
        document.getElementById('currentCall').textContent = lastCalled ? lastCalled.text : '-';
        document.getElementById('wordCloudPlay').innerHTML = wordList.map(w =>
          '<span class="cloudWord' + (w.called ? ' calledOut' : ' callable') + '" data-id="' + w.id + '">' + esc(w.text) + '</span>'
        ).join('');
      }

      names.forEach(id => {
        const s = students[id];
        if (s && s.bingo && !announced.has(id)){
          announced.add(id);
          const feed = document.getElementById('winnerFeed');
          const line = document.createElement('div');
          line.className = 'winnerLine';
          line.textContent = '🎉 ' + (s.name||'참가자') + ' 학생 빙고 완성!';
          feed.appendChild(line);
        }
      });
    }

    gameRef.on('value', snap => {
      const v = snap.val() || {};
      state = {
        topic: v.topic || '',
        size: v.size || 3,
        winLines: v.winLines || 1,
        phase: v.phase || 'collecting',
        words: v.words || {},
        students: v.students || {}
      };
      render();
    });

    document.getElementById('setTopicBtn').addEventListener('click', function(){
      const input = document.getElementById('topicInput');
      const val = input.value.trim();
      if (!val) return;
      gameRef.child('topic').set(val);
      input.value = '';
    });

    document.getElementById('addWordBtn').addEventListener('click', function(){
      const input = document.getElementById('wordInput');
      const w = input.value.trim();
      if (!w) { input.focus(); return; }
      const exists = Object.values(state.words||{}).some(e => e.text === w);
      if (!exists){
        gameRef.child('words').push({ text: w, called: false, calledAt: null });
      }
      input.value = '';
    });
    document.getElementById('wordInput').addEventListener('keydown', function(e){
      if (e.key === 'Enter') document.getElementById('addWordBtn').click();
    });

    document.querySelectorAll('.sizeBtn').forEach(btn=>{
      btn.addEventListener('click', function(){
        if (state.phase !== 'collecting') return;
        gameRef.child('size').set(parseInt(btn.dataset.v,10));
      });
    });
    document.querySelectorAll('.winBtn').forEach(btn=>{
      btn.addEventListener('click', function(){
        if (state.phase === 'playing') return;
        gameRef.child('winLines').set(parseInt(btn.dataset.v,10));
      });
    });

    document.getElementById('toBuildingBtn').addEventListener('click', function(){
      const wordList = Object.values(state.words||{});
      const need = state.size*state.size;
      if (wordList.length < need){ alert('낱말이 ' + (need-wordList.length) + '개 더 필요해요! (최소 ' + need + '개)'); return; }
      gameRef.child('phase').set('building');
    });
    document.getElementById('toPlayingBtn').addEventListener('click', function(){
      gameRef.child('phase').set('playing');
    });

    document.getElementById('wordCloudPlay').addEventListener('click', function(e){
      const tag = e.target.closest('.cloudWord');
      if (!tag || tag.classList.contains('calledOut')) return;
      gameRef.child('words').child(tag.dataset.id).update({ called: true, calledAt: firebase.database.ServerValue.TIMESTAMP });
    });

    document.getElementById('playAgainBtn').addEventListener('click', function(){
      if (!confirm('같은 낱말은 그대로 두고, 학생들의 빙고판과 부른 낱말 기록만 초기화해서 다시 할까요? (참가자는 그대로 유지돼요)')) return;
      gameRef.once('value', function(snap){
        const v = snap.val() || {};
        const words = v.words || {};
        const resetWords = {};
        Object.keys(words).forEach(function(k){
          resetWords[k] = { text: words[k].text, called: false, calledAt: null };
        });
        const students = v.students || {};
        const resetStudents = {};
        Object.keys(students).forEach(function(k){
          const s = students[k] || {};
          const size = s.size || v.size || 3;
          const blank = {};
          for (let i=0;i<size*size;i++) blank[String(i)] = '';
          resetStudents[k] = { name: s.name || '', size: size, cells: blank, bingo: false, bingoAt: null };
        });
        gameRef.update({ phase: 'building', words: resetWords, students: resetStudents });
      });
      announced.clear();
      document.getElementById('winnerFeed').innerHTML = '';
    });

    document.getElementById('copyLinkBtn').addEventListener('click', function(){
      const btn = this;
      const original = btn.textContent;
      function showResult(ok){
        btn.textContent = ok ? '✅ 복사됨!' : '복사 실패 — 직접 선택해 복사해주세요';
        setTimeout(function(){ btn.textContent = original; }, 1800);
      }
      function fallbackCopy(){
        studentUrlInput.select();
        studentUrlInput.setSelectionRange(0, 99999);
        try {
          showResult(document.execCommand('copy'));
        } catch (e) {
          showResult(false);
        }
      }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(studentUrl).then(function(){ showResult(true); }).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    });

    document.getElementById('resetBtn').addEventListener('click', function(){
      if (!confirm('낱말, 참가자, 진행 상황을 모두 지우고 처음부터 다시 시작할까요?')) return;
      gameRef.set({ topic:'', size:3, winLines:1, phase:'collecting', words:null, students:null });
      announced.clear();
      document.getElementById('winnerFeed').innerHTML = '';
    });
  })();
  </script>
</body>
</html>
